<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>프로필</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="page">
  <div class="cover" id="cover">
    <div class="cover-actions">
      <button class="icon-btn" id="adminLoginBtn" type="button">🔒 관리자</button>
      <div class="admin-only-controls" id="adminControls" hidden>
        <button class="icon-btn" id="editOpenBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          프로필 편집
        </button>
        <button class="icon-btn ghost" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
  </div>

  <section class="profile">
    <div class="avatar-row">
      <div class="avatar" id="avatar">?</div>
    </div>
    <div class="name-block">
      <h1 class="name">
        <span id="name">이름</span>
        <svg class="badge" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 14.5 4.5 17.9 4.1 18.6 7.5 21.5 9.4 20.1 12.5 21.5 15.6 18.6 17.5 17.9 20.9 14.5 20.5 12 23 9.5 20.5 6.1 20.9 5.4 17.5 2.5 15.6 3.9 12.5 2.5 9.4 5.4 7.5 6.1 4.1 9.5 4.5Z"/><path d="M9 12.3l2 2 4-4.3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </h1>
      <p class="handle" id="handle">@username</p>
      <p class="bio" id="bio"></p>
      <div class="meta" id="meta"></div>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab-btn is-active" id="tabBtnPosts" type="button" data-tab="posts" role="tab" aria-selected="true">게시물</button>
    <button class="tab-btn" id="tabBtnGuestbook" type="button" data-tab="guestbook" role="tab" aria-selected="false">방명록</button>
  </div>

  <section class="tab-panel" id="postsTab" role="tabpanel">
    <form class="compose" id="postForm" hidden novalidate>
      <textarea id="pMessage" name="message" maxlength="280" placeholder="무슨 생각을 하고 있나요?" required></textarea>

      <div class="media-preview" id="postMediaPreview" hidden>
        <img id="postMediaPreviewImg" alt="첨부 이미지 미리보기" />
        <button type="button" class="media-remove" id="postMediaRemoveBtn" aria-label="이미지 제거">✕</button>
      </div>

      <div class="compose-footer">
        <div class="compose-tools">
          <button type="button" class="media-btn" id="postMediaBtn" title="사진 추가" aria-label="사진 추가">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          </button>
          <input type="file" id="postMediaInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <span class="char-count" id="postCharCount">0 / 280</span>
        </div>
        <button class="submit-btn" type="submit" id="postSubmitBtn">게시하기</button>
      </div>
      <p class="form-msg" id="postFormMsg"></p>
    </form>

    <ul class="entries" id="posts"></ul>
  </section>

  <section class="tab-panel" id="guestbookTab" role="tabpanel" hidden>
    <form class="compose" id="guestForm" novalidate>
      <div class="compose-row">
        <input id="gName" name="name" maxlength="40" placeholder="작성자" autocomplete="off" required />
        <input id="gPasscode" name="passcode" type="password" maxlength="40" placeholder="비밀번호 (내 글 수정/삭제용)" autocomplete="new-password" required />
      </div>
      <textarea id="gMessage" name="message" maxlength="280" placeholder="할 말을 남겨주세요" required></textarea>

      <div class="media-preview" id="mediaPreview" hidden>
        <img id="mediaPreviewImg" alt="첨부 이미지 미리보기" />
        <button type="button" class="media-remove" id="mediaRemoveBtn" aria-label="이미지 제거">✕</button>
      </div>

      <div class="compose-footer">
        <div class="compose-tools">
          <button type="button" class="media-btn" id="mediaBtn" title="사진 추가" aria-label="사진 추가">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          </button>
          <input type="file" id="mediaInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <span class="char-count" id="charCount">0 / 280</span>
        </div>
        <button class="submit-btn" type="submit" id="submitBtn">남기기</button>
      </div>
      <p class="form-msg" id="formMsg"></p>
    </form>

    <ul class="entries" id="entries"></ul>
  </section>
</main>

<div class="overlay" id="editOverlay" hidden>
  <div class="edit-panel">
    <div class="edit-header">
      <h2>프로필 편집</h2>
      <button class="close-btn" id="editCloseBtn" type="button" aria-label="닫기">✕</button>
    </div>
    <form class="edit-form" id="editForm">
      <div class="field">
        <label for="fName">이름</label>
        <input id="fName" maxlength="40" required />
      </div>
      <div class="field">
        <label for="fHandle">아이디 (@ 뒤에 붙는 부분)</label>
        <input id="fHandle" maxlength="30" required />
      </div>
      <div class="field">
        <label for="fBio">자기소개</label>
        <textarea id="fBio" maxlength="160"></textarea>
      </div>
      <div class="field">
        <label for="fLocation">위치</label>
        <input id="fLocation" maxlength="40" placeholder="예: 서울" />
      </div>
      <div class="field">
        <label for="fJoined">가입/시작 문구</label>
        <input id="fJoined" maxlength="40" placeholder="예: 2021년부터" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fAvatar">프로필 사진 URL</label>
          <input id="fAvatar" placeholder="https://..." />
        </div>
        <div class="field">
          <label for="fCover">배경 사진 URL</label>
          <input id="fCover" placeholder="https://..." />
        </div>
      </div>
      <p class="field-hint">이미지 URL이 없으면 이니셜 아바타와 기본 배경이 표시돼요.</p>

      <div class="field passcode-field">
        <label for="fPasscode">편집 비밀번호</label>
        <input id="fPasscode" type="password" placeholder="설정한 비밀번호" required />
      </div>

      <p class="edit-msg" id="editMsg"></p>

      <div class="edit-actions">
        <button type="button" class="btn-secondary" id="editCancelBtn">취소</button>
        <button type="submit" class="btn-primary" id="editSaveBtn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
